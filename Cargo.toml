[workspace]
resolver = "3"
members = [
    "crates/artwork",
    "crates/audio",
    "crates/cirsium",
    "crates/cores/snes",
    "crates/models/core",
    "crates/models/debugger",
    "crates/models/workspace",
    "crates/playground",
    "crates/screenshotter",
    "crates/scripting",
    "crates/storage",
    "crates/testrunner",

    "frontends/debugger",
    "frontends/runner",
    "frontends/sly-launcher",
]

[workspace.dependencies]
gpui = { git = "https://github.com/ioncodes/zed", rev = "1f0b390b2024a7235a166f9f3c6f1c3775b7e045" }
gpui_platform = { git = "https://github.com/ioncodes/zed", rev = "1f0b390b2024a7235a166f9f3c6f1c3775b7e045" }
gpui_web = { git = "https://github.com/ioncodes/zed", rev = "1f0b390b2024a7235a166f9f3c6f1c3775b7e045" }
reqwest_client = { git = "https://github.com/ioncodes/zed", rev = "1f0b390b2024a7235a166f9f3c6f1c3775b7e045" }
tracing = { version = "0.1.44", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "ansi", "std", "env-filter"] }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
codegen-units = 1
#lto = "fat"
debug = true

[profile.dev]
opt-level = 3

[profile.web-release]
inherits = "release"
debug = false
strip = true
panic = "abort"
