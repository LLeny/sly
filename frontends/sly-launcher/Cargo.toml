[package]
name = "sly-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
artwork = { path = "../../crates/artwork", features = ["fetch"] }
bevy = { version = "0.19.0", features = ["wav"] }
audio = { path = "../../crates/audio" }
core-model = { path = "../../crates/models/core" }
crc32fast = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
snes = { path = "../../crates/cores/snes" }
storage = { path = "../../crates/storage" }
walkdir = "2.5.0"
