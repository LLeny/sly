[package]
name = "sly-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
artwork = { path = "../../crates/artwork", features = ["fetch"] }
bevy = { version = "0.19.0", features = ["wav"] }
audio = { path = "../../crates/audio" }
clap = { version = "4.6.4", features = ["derive"] }
core-model = { path = "../../crates/models/core" }
crc32fast = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
snes = { path = "../../crates/cores/snes" }
storage = { path = "../../crates/storage" }
toml = "1.1.4"
walkdir = "2.5.0"
shellexpand = { version = "3.1.2", features = ["path"] }

[target.'cfg(target_os = "ios")'.dependencies]
dirs = "6.0.0"
objc2 = "0.6.4"
raw-window-handle = "0.6.2"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
] }
