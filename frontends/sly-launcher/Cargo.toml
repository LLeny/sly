[package]
name = "sly-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["wav"] }
audio = { path = "../../crates/audio" }
core-model = { path = "../../crates/models/core" }
crc32fast = "1.5.0"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.11.0"
snes = { path = "../../crates/cores/snes" }
ureq = { version = "3.3.0", features = ["json"] }
walkdir = "2.5.0"
