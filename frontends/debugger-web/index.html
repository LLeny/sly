<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sly Debugger</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #11111b; color: #cdd6f4;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; opacity: 0.6;
        }
        #loading.hidden { display: none; }
        #loading.error { opacity: 1; }
        #loading .message { max-width: 34rem; padding: 0 1.5rem; line-height: 1.5; }
        #loading .message h1 { font-size: 1.2rem; margin-bottom: 0.75rem; }
        #loading .message p { font-size: 0.95rem; opacity: 0.8; margin-bottom: 0.5rem; }
        #loading .message code { font-family: ui-monospace, monospace; background: #1e1e2e; padding: 0.1em 0.35em; border-radius: 4px; }
        #loading .message ul { text-align: left; padding-left: 1.2rem; }
        #loading .message li { font-size: 0.95rem; opacity: 0.8; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div id="loading">Loading Sly Debugger...</div>
    <script type="module">
        const loading = document.getElementById('loading');

        const adapter = 'gpu' in navigator ? await navigator.gpu.requestAdapter().catch(() => null) : null;
        if (!adapter) {
            const hint = !window.isSecureContext
                ? `<p>This page is served over plain <code>http</code> on a non-localhost
                   origin, so the browser hides WebGPU. Open it via
                   <code>http://localhost:&lt;port&gt;</code> or serve
                   it over <code>https</code>.</p>`
                : `<ul>
                     <li><b>Chrome / Edge</b>: make sure hardware acceleration is on; on
                         Linux try <code>chrome://flags/#enable-vulkan</code> and
                         <code>chrome://flags/#enable-unsafe-webgpu</code>.</li>
                     <li><b>Firefox</b>: in <code>about:config</code> set
                         <code>dom.webgpu.enabled</code> (and, if it still fails,
                         <code>gfx.webgpu.force-enabled</code>), then restart.</li>
                     <li><b>Safari</b>: needs Safari 26+; on older versions enable WebGPU
                         under Develop &gt; Feature Flags.</li>
                   </ul>`;
            loading.classList.add('error');
            loading.innerHTML = `<div class="message"><h1>WebGPU is not available</h1>${hint}</div>`;
        } else {
            const { default: init } = await import('./debugger.js');
            await init();
            loading.classList.add('hidden');
        }
    </script>
</body>
</html>
