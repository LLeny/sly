language = "C"
include_guard = "SLY_H"
cpp_compat = true
header = "/* Sly C API. Generated by cbindgen, do not edit! */"
usize_is_size_t = true
documentation = true
documentation_style = "c99"

[const]
allow_static_const = false

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
