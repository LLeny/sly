[package]
name = "sly-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "sly"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
artwork = { path = "../../crates/artwork" }
core-model = { path = "../../crates/models/core" }
core-loader = { path = "../../crates/core-loader" }
storage = { path = "../../crates/storage" }

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }
