[package]
name = "sly-cxx"
version = "0.1.0"
edition = "2024"

[lib]
name = "sly_cxx"
crate-type = ["lib", "staticlib"]

[dependencies]
artwork = { path = "../../crates/artwork", features = ["fetch"] }
core-model = { path = "../../crates/models/core" }
core-loader = { path = "../../crates/core-loader" }
sly-ffi = { path = "../c" }
cxx = "1.0.198"

[build-dependencies]
cxx-build = "1.0.198"
