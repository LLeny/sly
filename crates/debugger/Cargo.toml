[package]
name = "debugger"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/ioncodes/zed", rev = "1d46944d6e139605a81094740188eecb4a9e903d" }
gpui_platform = { git = "https://github.com/ioncodes/zed", rev = "1d46944d6e139605a81094740188eecb4a9e903d", features = ["font-kit", "wayland", "x11"] }
cirsium = { path = "../cirsium" }
debugger-model = { path = "../models/debugger" }
frontend-model = { path = "../models/frontend" }
snes = { path = "../cores/snes", features = ["debug"] }
reqwest_client = { git = "https://github.com/ioncodes/zed", rev = "1d46944d6e139605a81094740188eecb4a9e903d" }
urlencoding = "2.1.3"
crc32fast = "1.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["registry", "fmt", "ansi", "std", "env-filter"] }
