[package]
name = "screenshotter"
version = "0.1.0"
edition = "2024"

[dependencies]
gba = { path = "../cores/gba" }
snes = { path = "../cores/snes" }
core-model = { path = "../models/core" }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
owo-colors = "4.3.0"
gif = "0.14.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
crc32fast = "1.5.0"
oxipng = { version = "10.1.1", default-features = false }
