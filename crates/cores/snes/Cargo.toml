[package]
name = "snes"
version = "0.1.0"
edition = "2024"

[features]
default = ["disasm"]
disasm = []
debug = ["dep:debugger-model", "dep:workspace-model"]

[dependencies]
chapa = { version = "0.7.1", features = ["reflection"] }
core-model = { path = "../../models/core" }
debugger-model = { path = "../../models/debugger", optional = true }
workspace-model = { path = "../../models/workspace", optional = true }
chipi-macros = { git = "https://github.com/ioncodes/chipi", branch = "1.0" }
inventory = "0.3.24"
thiserror = "2.0.18"
tracing.workspace = true
