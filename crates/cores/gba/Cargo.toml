[package]
name = "gba"
version = "0.1.0"
edition = "2024"

[features]
default = ["disasm"]
disasm = []
debug = ["dep:debugger-model"]

[dependencies]
chapa = { version = "0.9.0", features = ["reflection"] }
chipi-macros = "1.0.0"
core-model = { path = "../../models/core" }
debugger-model = { path = "../../models/debugger", optional = true }
crc32fast = "1.5.0"
sha1 = "0.11.0"
thiserror = "2.0.18"
tracing = { workspace = true }
