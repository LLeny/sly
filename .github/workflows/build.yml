name: Build

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NAGA_CLI_VERSION: "29.0.4"

jobs:
  debugger-wasm:
    name: Build debugger (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debugger-wasm
      - name: Format check
        run: cargo fmt --all --check
      - name: Build debugger (wasm32)
        if: github.event_name == 'pull_request'
        run: cargo build -p debugger --target wasm32-unknown-unknown

  debugger-native:
    name: Build debugger (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database
      - name: Install gpui native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libfontconfig1-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxext-dev libxfixes-dev libasound2-dev libudev-dev
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debugger-native
      - name: Build debugger (native)
        run: cargo build -p debugger

  launcher:
    name: Build launcher
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database
      - name: Install Bevy native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxext-dev libxfixes-dev \
            libfontconfig1-dev libfreetype6-dev \
            libegl-dev libgl1-mesa-dev
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher-native
      - name: Install Naga CLI
        run: cargo install naga-cli --version "$NAGA_CLI_VERSION" --locked
      - name: Check Naga CLI
        run: naga --version
      - name: Build launcher (native)
        run: cargo build -p sly-launcher

  bindings:
    name: Build C / C++ bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings
      - name: Build bindings
        run: cargo build -p sly-ffi -p sly-cxx
      - name: Check committed C header compiles
        run: |
          gcc -fsyntax-only -std=c11 -x c bindings/c/include/sly.h
          g++ -fsyntax-only -std=c++17 -x c++ bindings/c/include/sly.h
      - name: Check committed C header is current
        run: git diff --exit-code -- bindings/c/include/sly.h
