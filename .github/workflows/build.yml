name: Build

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Format check
        run: cargo fmt --all --check
      - name: Build debugger (wasm32)
        if: github.event_name == 'pull_request'
        run: cargo build -p debugger --target wasm32-unknown-unknown

  native:
    name: Build (native Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database
      - name: Install gpui native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxext-dev libxfixes-dev libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      - name: Build debugger (native)
        run: cargo build -p debugger
