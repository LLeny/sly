name: Binaries

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-binaries-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NAGA_CLI_VERSION: "29.0.4"
  QT_VERSION: "6.11.1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      ref: ${{ steps.plan.outputs.ref }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}

    steps:
      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          ref=
          tag=

          case "$GITHUB_EVENT_NAME" in
            push)
              channel=release
              sha="$GITHUB_SHA"
              tag="v$(date -u +%Y.%m.%d)-${sha::7}"
              ;;
            schedule | workflow_dispatch)
              channel=nightly
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)
              ref="$sha"
              tag=nightly
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null) || built=
              # Manual runs always rebuild; scheduled runs skip an unchanged dev.
              if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$sha" = "$built" ]; then
                build=false
              fi
              ;;
            *)
              channel=none
              sha="$GITHUB_SHA"
              ;;
          esac

          {
            echo "build=$build"
            echo "channel=$channel"
            echo "ref=$ref"
            echo "sha=$sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "channel=$channel build=$build sha=$sha tag=$tag"

  checks:
    name: Source checks
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Initialize build submodules
        run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace-checks

      - name: Format check
        run: cargo fmt --all --check

      - name: Build debugger (WASM)
        if: github.event_name == 'pull_request'
        run: cargo build --locked -p debugger --target wasm32-unknown-unknown

      - name: Build C binding
        run: cargo build --locked -p sly-ffi

      - name: Check committed C header
        run: |
          gcc -fsyntax-only -std=c11 -x c bindings/c/include/sly.h
          g++ -fsyntax-only -std=c++17 -x c++ bindings/c/include/sly.h
          git diff --exit-code -- bindings/c/include/sly.h

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Initialize build submodules
        shell: bash
        run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxext-dev libxfixes-dev \
            libegl-dev libgl1-mesa-dev

      - name: Select Linux C++23 compiler
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          g++-14 --version

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia qtshadertools
          cache: true

      - name: Set up Python for Windows Qt
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Windows Qt
        if: runner.os == 'Windows'
        id: qt-windows-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/Qt/${{ env.QT_VERSION }}/msvc2022_64
          key: qt-windows-${{ env.QT_VERSION }}-msvc2022_64-multimedia-shadertools-v1

      - name: Install Windows Qt
        if: runner.os == 'Windows' && steps.qt-windows-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==3.3.*"
          python .github/scripts/aqtinstall_qt611_windows.py install-qt `
            windows desktop "$env:QT_VERSION" win64_msvc2022_64 `
            --outputdir "$env:RUNNER_WORKSPACE/Qt" `
            --modules qtmultimedia qtshadertools

      - name: Configure Windows Qt environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = "$env:RUNNER_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64"
          if (!(Test-Path "$qtRoot/bin/qt-cmake.bat")) {
              throw "Qt installation is missing qt-cmake.bat at $qtRoot/bin"
          }
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          where.exe cl.exe

      - name: Install CMake and Ninja
        run: python -m pip install "cmake>=4.3,<4.4" ninja

      - name: Install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.12
          build-type: Release
          cmake-generator: Ninja
          cmake-arguments: >-
            -DSDL_SHARED=OFF -DSDL_STATIC=ON
            ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe' || '' }}
          install-linux-dependencies: true

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-binaries-${{ matrix.platform }}

      - name: Install Naga CLI
        run: cargo install naga-cli --version "${{ env.NAGA_CLI_VERSION }}" --locked

      - name: Build debugger
        run: cargo build --release --locked -p debugger

      - name: Build modern launcher
        run: cargo build --release --locked -p modern-launcher

      - name: Configure Qt client
        if: runner.os != 'Windows'
        shell: bash
        run: |
          qt-cmake -S frontends/desktop-qt -B build/desktop-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage/sly-classic" \
            -DSDL3_ROOT="${{ steps.sdl.outputs.prefix }}" \
            -DSLY_CARGO_PROFILE=release

      - name: Configure Qt client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/qt-cmake.bat" `
            -S frontends/desktop-qt `
            -B build/desktop-qt `
            -G Ninja `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/stage/sly-classic" `
            "-DSDL3_ROOT=${{ steps.sdl.outputs.prefix }}" `
            -DSLY_CARGO_PROFILE=release

      - name: Build and deploy Qt client
        run: |
          cmake --build build/desktop-qt --config Release
          cmake --install build/desktop-qt --config Release

      - name: Package Unix applications
        if: needs.plan.outputs.channel != 'none' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p stage/sly-debugger stage/sly-launcher dist
          install -m 755 target/release/sly-debugger stage/sly-debugger/sly-debugger
          install -m 755 target/release/sly-launcher stage/sly-launcher/sly-launcher
          for application in sly-debugger sly-launcher sly-classic; do
            install -m 644 LICENSE "stage/$application/LICENSE"
            cp -R licenses "stage/$application/"
            tar -czf "dist/$application-${{ matrix.platform }}.tar.gz" -C "stage/$application" .
          done

      - name: Package Windows applications
        if: needs.plan.outputs.channel != 'none' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/sly-debugger, stage/sly-launcher, dist | Out-Null
          Copy-Item target/release/sly-debugger.exe stage/sly-debugger/
          Copy-Item target/release/sly-launcher.exe stage/sly-launcher/
          foreach ($application in @("sly-debugger", "sly-launcher", "sly-classic")) {
            Copy-Item LICENSE "stage/$application/LICENSE"
            Copy-Item licenses "stage/$application/" -Recurse -Force
            Compress-Archive -Path "stage/$application/*" -DestinationPath "dist/$application-${{ matrix.platform }}.zip"
          }

      - name: Upload desktop archives
        if: needs.plan.outputs.channel != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/sly-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios:
    name: iOS (arm64, unsigned)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Initialize build submodule
        run: git submodule update --init --depth 1 submodules/chipi-spec

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-release

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS application
        run: |
          xcodebuild \
            -project frontends/ios/Sly.xcodeproj \
            -scheme Sly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        if: needs.plan.outputs.channel != 'none'
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/Sly.app dist/Payload/
          install -m 644 LICENSE dist/LICENSE
          cp -R licenses dist/
          cd dist
          zip -qry sly-ios-arm64-unsigned.ipa Payload LICENSE licenses

      - name: Upload iOS archive
        if: needs.plan.outputs.channel != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-unsigned
          path: dist/sly-ios-arm64-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish ${{ needs.plan.outputs.channel }}
    needs: [plan, checks, desktop, ios]
    if: needs.plan.outputs.channel != 'none' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: needs.plan.outputs.channel == 'release'
        run: |
          gh release create "$TAG" dist/* \
            --target "$SHA" \
            --title "Sly $TAG" \
            --generate-notes \
            --latest

      - name: Publish nightly
        if: needs.plan.outputs.channel == 'nightly'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) (${SHA::7})" \
            --notes "Automated build of \`dev\` at $SHA. Replaced daily when \`dev\` changes; expect bugs." \
            --prerelease
