name: Deploy WASM

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init build submodules
        run: git submodule update --init --depth 1 submodules/chipi-spec submodules/libretro-database

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: "0.2.126"

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Build web bundle
        run: |
          cargo build --profile web-release --target wasm32-unknown-unknown -p debugger
          wasm-bindgen target/wasm32-unknown-unknown/web-release/debugger.wasm \
            --target web --no-typescript --out-dir _site --out-name debugger
          wasm-opt -O3 \
            --enable-reference-types --enable-bulk-memory --enable-mutable-globals \
            --enable-sign-ext --enable-multivalue --enable-simd \
            --enable-nontrapping-float-to-int --enable-threads \
            -o _site/debugger_bg.wasm _site/debugger_bg.wasm
          cp frontends/debugger-web/index.html _site/index.html
          cp LICENSE _site/LICENSE
          cp -R licenses _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
